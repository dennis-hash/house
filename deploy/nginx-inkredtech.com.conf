# /etc/nginx/sites-available/inkredtech.com
# Enable:  sudo ln -s /etc/nginx/sites-available/inkredtech.com /etc/nginx/sites-enabled/
# HTTPS:   sudo certbot --nginx -d inkredtech.com -d www.inkredtech.com
server {
    listen 80;
    server_name inkredtech.com www.inkredtech.com;

    root /var/www/inkredtech.com;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hashed build assets never change, so cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the HTML so new deploys show up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
